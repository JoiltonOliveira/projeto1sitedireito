<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Direito Bancário</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <style>
      .login-shell {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, rgba(200, 169, 107, 0.08), rgba(0,0,0,0.92));
      }

      .login-card {
        background: rgba(18, 18, 18, 0.97);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: var(--shadow);
        padding: 2.5rem;
        width: min(420px, calc(100% - 2rem));
      }

      .login-card h1 {
        margin-top: 0;
        margin-bottom: 0.5rem;
        font-size: 1.8rem;
      }

      .login-card p {
        color: var(--muted);
        margin-bottom: 1.5rem;
      }

      .login-form {
        display: grid;
        gap: 1rem;
      }

      .login-form label {
        display: grid;
        gap: 0.45rem;
        font-weight: 600;
      }

      .login-form input {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0.8rem 0.9rem;
        font: inherit;
        background: #0d0d0d;
        color: var(--text);
      }

      .login-form input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(200, 169, 107, 0.15);
      }

      .login-error {
        background: rgba(200, 169, 107, 0.08);
        border: 1px solid rgba(200, 169, 107, 0.25);
        border-radius: 10px;
        padding: 0.75rem 0.9rem;
        color: #f5d08d;
        font-size: 0.9rem;
        display: none;
      }

      .login-error.show {
        display: block;
      }

      .login-loading {
        opacity: 0.6;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="login-shell">
      <div class="login-card">
        <h1>Painel Admin</h1>
        <p>Faça login para acessar o painel de leads.</p>

        <div id="login-error" class="login-error"></div>

        <form id="login-form" class="login-form" novalidate>
          <label>
            Senha de administrador
            <input
              type="password"
              name="password"
              placeholder="Digite a senha"
              required
              autocomplete="current-password"
            />
          </label>
          <button type="submit" class="button button-primary" style="width: 100%;">
            Entrar
          </button>
        </form>

        <p style="margin-top: 1.5rem; font-size: 0.85rem; color: var(--muted); text-align: center;">
          Voltar para <a href="/" style="color: var(--primary); text-decoration: none;">site inicial</a>
        </p>
      </div>
    </div>

    <script>
      const apiBase = window.location.protocol === 'file:' ? 'http://localhost:3000' : '';

      document.getElementById('login-form').addEventListener('submit', async (event) => {
        event.preventDefault();

        const form = event.target;
        const errorDiv = document.getElementById('login-error');
        const passwordInput = form.querySelector('input[name="password"]');
        const password = passwordInput.value.trim();

        errorDiv.textContent = '';
        errorDiv.classList.remove('show');

        if (!password) {
          errorDiv.textContent = 'Senha é obrigatória.';
          errorDiv.classList.add('show');
          return;
        }

        form.classList.add('login-loading');
        passwordInput.disabled = true;

        try {
          const response = await fetch(`${apiBase}/api/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password }),
          });

          const result = await response.json();

          if (!response.ok || !result.ok) {
            throw new Error(result.message || 'Erro ao fazer login');
          }

          window.location.href = '/admin';
        } catch (error) {
          console.error(error);
          errorDiv.textContent = error.message || 'Não foi possível fazer login.';
          errorDiv.classList.add('show');
          form.classList.remove('login-loading');
          passwordInput.disabled = false;
          passwordInput.focus();
        }
      });

      // Admin access is controlled by the server-side session check.
    </script>
  </body>
</html>
